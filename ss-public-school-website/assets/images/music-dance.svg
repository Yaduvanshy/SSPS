<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#mBg)"/>
  <circle cx="400" cy="270" r="175" fill="#ffffff" stroke="#e0e7ff" stroke-width="6"/>
  <!-- Musical Staff Wave -->
  <path d="M80 330 Q240 210 400 280 T720 220" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <path d="M80 365 Q240 245 400 315 T720 255" fill="none" stroke="#4338ca" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
  <!-- Tabla / Drum -->
  <ellipse cx="290" cy="340" rx="75" ry="26" fill="#d97706"/>
  <path d="M215 340 l18 85 c8 14 106 14 114 0 l18 -85 z" fill="#92400e"/>
  <ellipse cx="290" cy="340" rx="68" ry="20" fill="#fef3c7" stroke="#0f294a" stroke-width="4"/>
  <circle cx="290" cy="340" r="18" fill="#0f294a"/>
  <!-- Musical Notes -->
  <g fill="#0f294a">
    <ellipse cx="475" cy="325" rx="22" ry="16" transform="rotate(-20 475 325)"/>
    <rect x="490" y="190" width="12" height="135" rx="4"/>
    <ellipse cx="555" cy="305" rx="22" ry="16" transform="rotate(-20 555 305)"/>
    <rect x="570" y="170" width="12" height="135" rx="4"/>
    <polygon points="490,190 582,170 582,196 490,216"/>
  </g>
  <!-- Floating notes -->
  <circle cx="205" cy="180" r="24" fill="#fef3c7"/>
  <text x="205" y="190" text-anchor="middle" font-size="30" fill="#d97706">♪</text>
  <circle cx="610" cy="145" r="26" fill="#e0e7ff"/>
  <text x="610" y="156" text-anchor="middle" font-size="30" fill="#4338ca">♫</text>
</svg>
