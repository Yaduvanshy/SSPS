<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#stageBg)"/>
  <!-- Stage spotlights -->
  <polygon points="220,40 380,430 140,430" fill="#fde68a" opacity="0.45"/>
  <polygon points="580,40 660,430 420,430" fill="#bfdbfe" opacity="0.45"/>
  <!-- Curtains -->
  <path d="M0 0 h175 c-10 170 -35 280 -85 430 H0 Z" fill="url(#curtain)"/>
  <path d="M800 0 h-175 c10 170 35 280 85 430 H800 Z" fill="url(#curtain)"/>
  <path d="M0 0 q200 75 400 0 q200 75 400 0 v35 q-200 65 -400 0 q-200 65 -400 0 z" fill="#991b1b"/>
  <!-- Stage floor -->
  <rect x="0" y="425" width="800" height="135" fill="#0f294a"/>
  <rect x="0" y="425" width="800" height="14" fill="#f59e0b"/>
  <!-- Trophy & Drama Masks Centerpiece -->
  <g transform="translate(400,260)">
    <circle r="110" fill="#ffffff" stroke="#fde68a" stroke-width="5"/>
    <path d="M-42 -42 h84 v46 c0 26 -18 46 -42 46 c-24 0 -42 -20 -42 -46 z" fill="#f59e0b"/>
    <path d="M-42 -28 h-22 c0 28 10 38 22 38" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
    <path d="M42 -28 h22 c0 28 -10 38 -22 38" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
    <rect x="-10" y="50" width="20" height="28" fill="#d97706"/>
    <rect x="-34" y="76" width="68" height="14" rx="5" fill="#0f294a"/>
    <polygon points="0,-24 6,-9 22,-9 9,0 14,16 0,7 -14,16 -9,0 -22,-9 -6,-9" fill="#fffbeb"/>
  </g>
  <!-- Festive Bunting -->
  <circle cx="240" cy="120" r="10" fill="#f59e0b"/>
  <circle cx="560" cy="120" r="10" fill="#059669"/>
  <circle cx="400" cy="95" r="12" fill="#2563eb"/>
</svg>
