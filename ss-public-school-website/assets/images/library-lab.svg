  <rect x="84" y="305" width="272" height="12" rx="4" fill="#cbd5e1"/>
  <!-- Books row 1 -->
  <rect x="98" y="128" width="28" height="67" rx="4" fill="#0f294a"/>
  <rect x="130" y="138" width="24" height="57" rx="4" fill="#f59e0b"/>
  <rect x="158" y="122" width="32" height="73" rx="4" fill="#2563eb"/>
  <rect x="194" y="142" width="26" height="53" rx="4" fill="#059669"/>
  <rect x="224" y="130" width="28" height="65" rx="4" fill="#dc2626"/>
  <rect x="262" y="145" width="26" height="50" rx="4" transform="rotate(8 275 170)" fill="#7c3aed"/>
  <!-- Books row 2 -->
  <rect x="98" y="236" width="32" height="69" rx="4" fill="#059669"/>
  <rect x="134" y="246" width="26" height="59" rx="4" fill="#0f294a"/>
  <rect x="164" y="230" width="28" height="75" rx="4" fill="#f59e0b"/>
  <rect x="200" y="268" width="130" height="18" rx="4" fill="#3b82f6"/>
  <rect x="206" y="286" width="122" height="19" rx="4" fill="#1e3a6e"/>
  <!-- Study table -->
  <rect x="70" y="420" width="660" height="22" rx="8" fill="#0f294a"/>
  <rect x="120" y="442" width="24" height="80" rx="6" fill="#1e3a6e"/>
  <rect x="656" y="442" width="24" height="80" rx="6" fill="#1e3a6e"/>
  <!-- Microscope -->
  <path d="M510 420 h110 v-18 h-110 z" fill="#334155"/>
  <path d="M575 402 c35 -28 40 -95 10 -128" fill="none" stroke="#0f294a" stroke-width="18" stroke-linecap="round"/>
