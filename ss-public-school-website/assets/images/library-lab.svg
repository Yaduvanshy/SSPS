    <linearGradient id="flask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <circle cx="670" cy="110" r="85" fill="#fef3c7"/>
  <rect x="60" y="95" width="320" height="310" rx="16" fill="#ffffff" stroke="#dbeafe" stroke-width="4"/>
